[tool.poetry]
name = "time-series-forecasting"
version = "0.1.0"
description = "Reproducible 90-day retail demand forecasting pipeline"
authors = ["Project contributors"]
readme = "README.md"
packages = [{ include = "forecasting", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
numpy = ">=1.26,<3.0"
pandas = ">=2.0,<3.0"
scikit-learn = ">=1.4,<2.0"
mlforecast = ">=0.13,<2.0"
lightgbm = ">=4.0,<5.0"
xgboost = ">=2.0,<4.0"
joblib = ">=1.3,<2.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<10.0"
ruff = ">=0.9,<1.0"
pre-commit = ">=4.0,<5.0"

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
